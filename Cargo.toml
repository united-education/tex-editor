[package]
name = "tex-editor"
version = "0.1.0"
edition = "2021"
description = "Editor WYSIWYG de arquivos .tex que preserva o fonte original"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

[profile.release]
opt-level = 3
strip = true
